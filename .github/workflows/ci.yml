name: CI

on:
  push:
    branches: [main, rust-rewrite]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: cargo test + build (Windows MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (pinned, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sitguard-rs/package-lock.json

      # NOTE: this is a Tauri layout — the Cargo manifest lives in
      # sitguard-rs/src-tauri/, so the build dir is src-tauri/target (NOT
      # sitguard-rs/target). Getting this path wrong silently disables the
      # cache and makes every run rebuild tract from scratch (~4+ min).
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sitguard-rs/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('sitguard-rs/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install frontend deps
        working-directory: sitguard-rs
        run: npm ci

      - name: Frontend type-check + build
        working-directory: sitguard-rs
        run: npm run build

      # Style gates are advisory: they surface problems without turning the
      # pipeline red over cosmetics. Correctness gates below are blocking.
      - name: cargo fmt check (advisory)
        working-directory: sitguard-rs/src-tauri
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: cargo clippy (advisory)
        working-directory: sitguard-rs/src-tauri
        continue-on-error: true
        run: cargo clippy --all-targets -- -D warnings

      # Blocking: runs the 26 unit tests, including real tract-onnx inference
      # (movenet_loads_and_infers_17_keypoints), the onnxruntime golden-value
      # check that pins the vendored tract patches
      # (movenet_matches_onnxruntime_reference), YuNet detection, and the
      # skeleton-angle / label-hysteresis coverage added with the posture
      # scoring rework.
      - name: cargo test (library)
        working-directory: sitguard-rs/src-tauri
        run: cargo test --lib

      - name: cargo build (debug, compile check)
        working-directory: sitguard-rs/src-tauri
        run: cargo build
