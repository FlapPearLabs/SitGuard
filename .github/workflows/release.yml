name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.bundles }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: appimage
          - os: windows-latest
            bundles: msi
          - os: macos-latest
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget \
            file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libv4l-dev libfuse2 patchelf

      - name: Install Rust (pinned)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sitguard-rs/package-lock.json

      # Tauri layout: the Cargo manifest lives in sitguard-rs/src-tauri/, so the
      # build dir is src-tauri/target (NOT sitguard-rs/target).
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sitguard-rs/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('sitguard-rs/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install frontend deps
        working-directory: sitguard-rs
        run: npm ci

      # Builds the platform bundle and publishes it to the GitHub Release for
      # this tag. macOS runs WITHOUT Apple signing/notarization secrets, so the
      # .dmg/.app are unsigned (Gatekeeper will block first launch; users
      # right-click -> Open to bypass).
      - name: Build & publish (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: sitguard-rs
          tagName: 'v__VERSION__'
          releaseName: 'SitGuard v__VERSION__'
          releaseBody: |
            SitGuard v__VERSION__ — 三平台发布

            | 平台 | 资产 | 说明 |
            |------|------|------|
            | Windows 10/11 | `SitGuard_<version>_x64_en-US.msi` | 安装程序，双击安装 |
            | Linux (glibc) | `SitGuard_<version>_amd64.AppImage` | `chmod +x` 后运行，免 root |
            | macOS 11+ (Apple Silicon) | `SitGuard.app.tar.gz` / `.dmg` | **未签名**，首次启动右键 → 打开绕过 Gatekeeper |

            MoveNet 与 YuNet 模型均已打包进安装包（`resources/models/`），无需额外下载、零联网。
            首次使用请坐正后在界面上点「重新标定」设定基线——坐姿判定相对你自己的直立姿势。
          releaseDraft: false
          prerelease: false
          args: --bundles ${{ matrix.bundles }}
