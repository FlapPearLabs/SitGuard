[package]
name = "sitguard-rs"
version = "0.1.0"
description = "SitGuard - sitting posture guardian (Rust rewrite)"
authors = ["SitGuard"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sitguard_rs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
# System notifications for break / posture reminders.
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nokhwa = { version = "0.10", features = ["input-native"] }
log = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
base64 = "0.22"
# Pure-Rust ONNX inference (no onnxruntime.dll, no CDN binary download —
# required because this machine can only reach rsproxy.cn crates mirror)
tract-onnx = "0.21"

# Three upstream tract bugs block MoveNet; all are patched in vendor/ and wired
# in below. Each patched file starts with a comment block describing the bug,
# how it manifests and what the fix is.
#
#   vendor/tract-hir  — GatherND shape inference underflows (`indices_rank - n`
#                       on usize), which makes the rule solver push rules until
#                       the process aborts on a ~2 GiB allocation while loading
#                       the model. Still broken in 0.23.4.
#   vendor/tract-onnx — Resize ignores an empty `scales` input and returns the
#                       tensor unresized; and half_pixel extrapolates off the
#                       left/top edge instead of clamping, corrupting the border
#                       of every upsampled feature map.
[patch.crates-io]
tract-hir = { path = "vendor/tract-hir" }
tract-onnx = { path = "vendor/tract-onnx" }

[profile.release]
lto = true
codegen-units = 1
strip = true
